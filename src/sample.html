<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2048風ゲーム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: none;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: white;
            margin-bottom: 10px;
            font-size: 48px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .score-container {
            color: white;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .game-board {
            background: #bbada0;
            border-radius: 10px;
            padding: 10px;
            display: inline-block;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            width: min(80vw, 400px);
            height: min(80vw, 400px);
        }

        .cell {
            background: #cdc1b4;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            color: #776e65;
            transition: all 0.15s ease-in-out;
        }

        .cell.tile {
            animation: pop 0.2s ease-in-out;
        }

        @keyframes pop {
            0% { transform: scale(0); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* タイルの色 */
        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 28px; }
        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 28px; }
        .tile-512 { background: #edc850; color: #f9f6f2; font-size: 28px; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 24px; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 24px; }

        .controls {
            margin-top: 20px;
            color: white;
        }

        .btn-new-game {
            background: #8f7a66;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: background 0.3s;
        }

        .btn-new-game:hover {
            background: #9f8a76;
        }

        .btn-new-game:active {
            transform: translateY(2px);
        }

        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .game-over.show {
            display: flex;
        }

        .game-over-content {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
        }

        .game-over-content h2 {
            margin-bottom: 20px;
            color: #776e65;
        }

        @media (max-width: 600px) {
            h1 { font-size: 36px; }
            .score-container { font-size: 20px; }
            .cell { font-size: 24px; }
            .tile-128, .tile-256, .tile-512 { font-size: 20px; }
            .tile-1024, .tile-2048 { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>2048</h1>
        <div class="score-container">
            スコア: <span id="score">0</span>
        </div>
        <div class="game-board">
            <div class="grid" id="grid"></div>
        </div>
        <div class="controls">
            <p>スワイプまたはWASDキーで操作</p>
            <button class="btn-new-game" onclick="game.newGame()">新しいゲーム</button>
        </div>
    </div>

    <div class="game-over" id="gameOver">
        <div class="game-over-content">
            <h2>ゲームオーバー</h2>
            <p>スコア: <span id="finalScore">0</span></p>
            <button class="btn-new-game" onclick="game.newGame()">もう一度</button>
        </div>
    </div>

    <script>
        class Game2048 {
            constructor() {
                this.gridSize = 4;
                this.grid = [];
                this.score = 0;
                this.touchStartX = 0;
                this.touchStartY = 0;
                this.touchEndX = 0;
                this.touchEndY = 0;
                
                this.init();
            }

            init() {
                this.setupGrid();
                this.setupEventListeners();
                this.newGame();
            }

            setupGrid() {
                const gridElement = document.getElementById('grid');
                gridElement.innerHTML = '';
                
                for (let i = 0; i < this.gridSize * this.gridSize; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `cell-${i}`;
                    gridElement.appendChild(cell);
                }
            }

            setupEventListeners() {
                // キーボード操作
                document.addEventListener('keydown', (e) => {
                    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(e.key)) {
                        e.preventDefault();
                        this.handleInput(e.key);
                    }
                });

                // タッチ操作
                const grid = document.getElementById('grid');
                grid.addEventListener('touchstart', (e) => {
                    this.touchStartX = e.touches[0].clientX;
                    this.touchStartY = e.touches[0].clientY;
                }, { passive: true });

                grid.addEventListener('touchend', (e) => {
                    this.touchEndX = e.changedTouches[0].clientX;
                    this.touchEndY = e.changedTouches[0].clientY;
                    this.handleSwipe();
                }, { passive: true });
            }

            handleSwipe() {
                const deltaX = this.touchEndX - this.touchStartX;
                const deltaY = this.touchEndY - this.touchStartY;
                const minSwipeDistance = 30;

                if (Math.abs(deltaX) < minSwipeDistance && Math.abs(deltaY) < minSwipeDistance) {
                    return;
                }

                if (Math.abs(deltaX) > Math.abs(deltaY)) {
                    // 横方向
                    if (deltaX > 0) {
                        this.move('right');
                    } else {
                        this.move('left');
                    }
                } else {
                    // 縦方向
                    if (deltaY > 0) {
                        this.move('down');
                    } else {
                        this.move('up');
                    }
                }
            }

            handleInput(key) {
                const keyMap = {
                    'ArrowUp': 'up',
                    'ArrowDown': 'down',
                    'ArrowLeft': 'left',
                    'ArrowRight': 'right',
                    'w': 'up',
                    's': 'down',
                    'a': 'left',
                    'd': 'right'
                };

                const direction = keyMap[key];
                if (direction) {
                    this.move(direction);
                }
            }

            newGame() {
                this.grid = Array(this.gridSize).fill(null).map(() => Array(this.gridSize).fill(0));
                this.score = 0;
                this.updateScore();
                this.addNewTile();
                this.addNewTile();
                this.render();
                document.getElementById('gameOver').classList.remove('show');
            }

            addNewTile() {
                const emptyCells = [];
                for (let i = 0; i < this.gridSize; i++) {
                    for (let j = 0; j < this.gridSize; j++) {
                        if (this.grid[i][j] === 0) {
                            emptyCells.push({row: i, col: j});
                        }
                    }
                }

                if (emptyCells.length > 0) {
                    const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                    this.grid[randomCell.row][randomCell.col] = Math.random() < 0.9 ? 2 : 4;
                }
            }

            move(direction) {
                const oldGrid = JSON.stringify(this.grid);
                
                switch(direction) {
                    case 'up':
                        this.moveUp();
                        break;
                    case 'down':
                        this.moveDown();
                        break;
                    case 'left':
                        this.moveLeft();
                        break;
                    case 'right':
                        this.moveRight();
                        break;
                }

                if (oldGrid !== JSON.stringify(this.grid)) {
                    this.addNewTile();
                    this.render();
                    this.updateScore();
                    
                    if (this.isGameOver()) {
                        setTimeout(() => {
                            document.getElementById('finalScore').textContent = this.score;
                            document.getElementById('gameOver').classList.add('show');
                        }, 300);
                    }
                }
            }

            moveLeft() {
                for (let i = 0; i < this.gridSize; i++) {
                    let row = this.grid[i].filter(val => val !== 0);
                    for (let j = 0; j < row.length - 1; j++) {
                        if (row[j] === row[j + 1]) {
                            row[j] *= 2;
                            this.score += row[j];
                            row.splice(j + 1, 1);
                        }
                    }
                    while (row.length < this.gridSize) {
                        row.push(0);
                    }
                    this.grid[i] = row;
                }
            }

            moveRight() {
                for (let i = 0; i < this.gridSize; i++) {
                    let row = this.grid[i].filter(val => val !== 0);
                    for (let j = row.length - 1; j > 0; j--) {
                        if (row[j] === row[j - 1]) {
                            row[j] *= 2;
                            this.score += row[j];
                            row.splice(j - 1, 1);
                            j--;
                        }
                    }
                    while (row.length < this.gridSize) {
                        row.unshift(0);
                    }
                    this.grid[i] = row;
                }
            }

            moveUp() {
                for (let j = 0; j < this.gridSize; j++) {
                    let col = [];
                    for (let i = 0; i < this.gridSize; i++) {
                        if (this.grid[i][j] !== 0) {
                            col.push(this.grid[i][j]);
                        }
                    }
                    for (let i = 0; i < col.length - 1; i++) {
                        if (col[i] === col[i + 1]) {
                            col[i] *= 2;
                            this.score += col[i];
                            col.splice(i + 1, 1);
                        }
                    }
                    while (col.length < this.gridSize) {
                        col.push(0);
                    }
                    for (let i = 0; i < this.gridSize; i++) {
                        this.grid[i][j] = col[i];
                    }
                }
            }

            moveDown() {
                for (let j = 0; j < this.gridSize; j++) {
                    let col = [];
                    for (let i = 0; i < this.gridSize; i++) {
                        if (this.grid[i][j] !== 0) {
                            col.push(this.grid[i][j]);
                        }
                    }
                    for (let i = col.length - 1; i > 0; i--) {
                        if (col[i] === col[i - 1]) {
                            col[i] *= 2;
                            this.score += col[i];
                            col.splice(i - 1, 1);
                            i--;
                        }
                    }
                    while (col.length < this.gridSize) {
                        col.unshift(0);
                    }
                    for (let i = 0; i < this.gridSize; i++) {
                        this.grid[i][j] = col[i];
                    }
                }
            }

            isGameOver() {
                // 空きマスがあるか
                for (let i = 0; i < this.gridSize; i++) {
                    for (let j = 0; j < this.gridSize; j++) {
                        if (this.grid[i][j] === 0) return false;
                    }
                }

                // 結合可能なタイルがあるか
                for (let i = 0; i < this.gridSize; i++) {
                    for (let j = 0; j < this.gridSize; j++) {
                        const current = this.grid[i][j];
                        if (j < this.gridSize - 1 && current === this.grid[i][j + 1]) return false;
                        if (i < this.gridSize - 1 && current === this.grid[i + 1][j]) return false;
                    }
                }

                return true;
            }

            updateScore() {
                document.getElementById('score').textContent = this.score;
            }

            render() {
                for (let i = 0; i < this.gridSize; i++) {
                    for (let j = 0; j < this.gridSize; j++) {
                        const cellIndex = i * this.gridSize + j;
                        const cell = document.getElementById(`cell-${cellIndex}`);
                        const value = this.grid[i][j];
                        
                        cell.textContent = value === 0 ? '' : value;
                        cell.className = 'cell';
                        if (value !== 0) {
                            cell.classList.add('tile', `tile-${value}`);
                        }
                    }
                }
            }
        }

        // ゲーム開始
        const game = new Game2048();
    </script>
</body>
</html>
